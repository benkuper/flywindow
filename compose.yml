services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CACHE_DIR: /app/data/cache
      CUSTOM_SITES_FILE: /app/data/sites.geojson
      TEST_DATA: "false"
      ALLOW_LOCAL_TEST_UPSTREAMS: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - flywindow-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  flywindow-data:
